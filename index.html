<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>CO2 PINN v5.2 - 3D Viewer</title>
<style>
body { margin:0; background:#101827; color:white; font-family:Arial,sans-serif; }
header { padding:18px; background:#1b2b42; }
h2 { margin:0 0 8px; }
#viewer { width:100%; height:80vh; }
</style>
</head>
<body>
<header>
<h2>CO₂ PINN v5.2｜地下封存三維模擬</h2>
<div id="info">正在載入資料...</div>
</header>
<div id="viewer"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const viewer = document.getElementById("viewer");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101827);

const camera = new THREE.PerspectiveCamera(
  50, viewer.clientWidth/viewer.clientHeight, 0.1, 1000
);
camera.position.set(30,25,30);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(viewer.clientWidth,viewer.clientHeight);
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,2));

fetch("./co2_data.json")
.then(r => {
  if (!r.ok) throw new Error("JSON 載入失敗");
  return r.json();
})
.then(data => {
  const nx=data.x.length, ny=data.y.length, nz=data.z.length;
  const values=data.sg.flat(2);
  const min=Math.min(...values), max=Math.max(...values);

  const geometry=new THREE.BoxGeometry(0.82,0.82,0.82);
  const material=new THREE.MeshBasicMaterial({color:0xffffff});
  const mesh=new THREE.InstancedMesh(geometry,material,nx*ny*nz);

  const dummy=new THREE.Object3D();
  const color=new THREE.Color();
  let index=0;

  for(let i=0;i<nx;i++){
    for(let j=0;j<ny;j++){
      for(let k=0;k<nz;k++){
        const t=(data.sg[i][j][k]-min)/(max-min||1);
        dummy.position.set(i-(nx-1)/2,k-(nz-1)/2,j-(ny-1)/2);
        dummy.updateMatrix();
        mesh.setMatrixAt(index,dummy.matrix);
        color.setHSL((1-t)*0.66,1,0.5);
        mesh.setColorAt(index,color);
        index++;
      }
    }
  }

  mesh.instanceMatrix.needsUpdate=true;
  mesh.instanceColor.needsUpdate=true;
  scene.add(mesh);

  document.getElementById("info").textContent =
    `第 ${data.day} 天｜${index} 格｜Sg ${min.toFixed(6)} ~ ${max.toFixed(6)}`;
})
.catch(err => {
  document.getElementById("info").textContent = "錯誤：" + err.message;
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=viewer.clientWidth/viewer.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewer.clientWidth,viewer.clientHeight);
});
</script>


</body>
</html>
